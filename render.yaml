services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Node.js / Express API)
  # -------------------------------------------------------------
  - type: web
    name: utsavmitra-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: utsavmitra-frontend
          property: host

  # -------------------------------------------------------------
  # 2. Frontend Static Site (Vite / React SPA)
  # -------------------------------------------------------------
  - type: web
    name: utsavmitra-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: utsavmitra-backend
          property: host
